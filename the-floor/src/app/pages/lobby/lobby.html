<div class="flex min-h-screen flex-col items-center px-4 py-12">
    <h1 class="mb-10 flex space-x-1 font-display text-6xl font-semibold text-gold">
        <span class="inline-block animate-wiggle [animation-delay:0ms]">P</span>
        <span class="inline-block animate-wiggle [animation-delay:50ms]">r</span>
        <span class="inline-block animate-wiggle [animation-delay:100ms]">a</span>
        <span class="inline-block animate-wiggle [animation-delay:150ms]">e</span>
        <span class="inline-block animate-wiggle [animation-delay:200ms]">s</span>
        <span class="inline-block animate-wiggle [animation-delay:250ms]">e</span>
        <span class="inline-block animate-wiggle [animation-delay:300ms]">s</span>
        <span class="inline-block animate-wiggle [animation-delay:350ms]">J</span>
        <span class="inline-block animate-wiggle [animation-delay:400ms]">a</span>
        <span class="inline-block animate-wiggle [animation-delay:400ms]">c</span>
        <span class="inline-block animate-wiggle [animation-delay:400ms]">k</span>
    </h1>

    <div class="flex flex-col items-start justify-center gap-6">
        <section class="w-full flex-shrink-0 rounded-2xl border border-gold bg-panel p-6">
            <h2 class="text-text py-2">Enter your name to join a table</h2>
            
            <form [formGroup]="createTable" (ngSubmit)="onCreateRoom()" class="flex flex-col gap-4">
                <label class="flex flex-col gap-1 text-text-dim">Name:
                    <input formControlName="name" placeholder="Jacob" class="w-full rounded-lg border border-gold p-2" />
                </label>

                <button type="submit" class="mt-2 rounded-full bg-gold py-2 shadow-md shadow-bg">
                    Join a Table
                </button>
            </form>
        </section>
    </div>
</div>>

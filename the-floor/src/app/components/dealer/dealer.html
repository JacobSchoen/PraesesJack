<div class="flex flex-col items-center py-6 text-text-dim">
    <p>The House</p>

    <div class="flex flex-row">
        @for (card of hand().cards; track card; let i = $index) {
        <app-playing-card [card]="{ value: card.value, suit: card.suit}" [hidden]="hand().cards.length === 2 && i === 1 && status() === 'PlayerTurn'"
            [style.transform]="'rotate(' + fanAngle(i, hand().cards.length) + 'deg) translateY(var(--ty, 0px))'" />
        }
    </div>

    @if (status() !== 'PlayerTurn') {
        <div>
        Score: {{hand().score}}
    </div>
    }
    
</div>
